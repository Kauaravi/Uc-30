<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <style>
        .erro{
            background-color: #ffb3b3;
            color: darkred;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            width: 300px;
        }

        .sucesso {
            background-color: #b3ffb3;
            color: darkgreen;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            width: 300px;
        }

        
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Cadastro de Usuário</h2>

    {% with mensagens = get flashed_messages(with_categories=true) %}
        {% if mensagens %}
            
        <p>
            <strong>{{ categoria }}:</strong> {{ mensagem }}
        </p>
        {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('cadastro') }}" method="post">
        <label>Nome:</label><br>
        <input type="text" name="nome"><br><br>

        <label>Email:</label><br>
        <input type="email" name="email"><br><br>

        <input type="submit">Cadastrar</button>
        
    </form>

</body>
</html>
